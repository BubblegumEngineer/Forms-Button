<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML + CSS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>HTML Forms</h1>
    <form action="#">
      <div>
        <label for="full-name"> Enter Your Full Name </label>
        <input type="text" required id="full-name" name="full-name" />
      </div>
      <div>
        <label for="screen-time"
          >"How many hours of screen time do you have per day ?"</label
        >
        <input
          type="number"
          required
          id="screen-time"
          name="screen-time"
          min="0"
          max="24"
        />
      </div>
      <div>
        <input type="submit" />
      </div>
    </form>
  </body>
</html>
